<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analyzer - Rukhsana Kanwal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg">AI Resume Analyzer</h1>
                    <span class="text-xs text-blue-400">10-Day Full Stack Journey • Day 10 Project</span>
                </div>
            </div>
            <div class="text-xs font-bold px-3 py-1 bg-blue-500/20 text-blue-300 rounded-full">
                Rukhsana Kanwal
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <label class="font-bold text-slate-800 block mb-2"><i class="fa-solid fa-file-lines text-blue-600 mr-2"></i>Resume / CV Text</label>
                <textarea id="resumeInput" rows="10" class="w-full p-4 rounded-xl border border-slate-200 text-sm font-mono bg-slate-50">RUKHSANA KANWAL - Full Stack Developer
Email: rukhsana@example.com | GitHub: github.com/rKanwal-codes

SUMMARY:
Passionate MERN Stack Developer with strong foundations in building responsive web applications, REST APIs, and database design.

SKILLS:
Frontend: HTML, CSS, JavaScript (ES6+), React.js, Tailwind CSS
Backend: Node.js, Express.js, REST API, JWT Authentication
Database: MongoDB, Mongoose
Tools: Git, GitHub, VS Code, Postman</textarea>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <div>
                    <label class="font-bold text-slate-800 block mb-2"><i class="fa-solid fa-briefcase text-blue-600 mr-2"></i>Target Job Description</label>
                    <textarea id="jobInput" rows="10" class="w-full p-4 rounded-xl border border-slate-200 text-sm font-mono bg-slate-50">JOB TITLE: Full Stack MERN Developer

REQUIREMENTS:
- Proficient in React.js, JavaScript, Node.js, and Express.js
- Experience with MongoDB, Mongoose schemas, and database CRUD operations
- Knowledge of JWT Authentication and REST API design
- Experience using HTML, CSS, Tailwind CSS, and Git version control
- Familiarity with TypeScript, Redux Toolkit, and Docker is a plus!</textarea>
                </div>
                <button onclick="runATSCheck()" id="btnAnalyze" class="mt-4 w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition">
                    <i class="fa-solid fa-chart-pie mr-2"></i> Calculate ATS Score & Analyze
                </button>
            </div>
        </div>

        <div id="resultsView" class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <div class="flex items-center justify-between border-b pb-6">
                <div>
                    <span class="text-xs font-bold text-slate-400 uppercase">Analysis Results</span>
                    <h2 class="text-3xl font-extrabold text-slate-900 mt-1">ATS Score: <span id="atsScoreVal" class="text-emerald-600">88/100</span></h2>
                </div>
                <span class="px-4 py-2 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full">Great Compatibility 🎉</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h3 class="font-bold text-slate-800 mb-3 text-sm">Matched Tech Keywords</h3>
                    <div id="matchedList" class="flex flex-wrap gap-2"></div>
                </div>
                <div>
                    <h3 class="font-bold text-amber-700 mb-3 text-sm">Missing Keywords from Job</h3>
                    <div id="missingList" class="flex flex-wrap gap-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function runATSCheck() {
            const resume = document.getElementById('resumeInput').value.toLowerCase();
            const job = document.getElementById('jobInput').value.toLowerCase();
            
            const keywords = ['javascript', 'react.js', 'node.js', 'express.js', 'mongodb', 'html', 'css', 'git', 'rest api', 'jwt', 'tailwind css', 'typescript', 'redux toolkit', 'docker'];
            
            let matched = [];
            let missing = [];

            keywords.forEach(kw => {
                if (job.includes(kw)) {
                    if (resume.includes(kw)) matched.push(kw.toUpperCase());
                    else missing.push(kw.toUpperCase());
                }
            });

            document.getElementById('matchedList').innerHTML = matched.map(k => `<span class="px-3 py-1 bg-blue-50 text-blue-700 border border-blue-200 rounded-lg text-xs font-semibold">✓ ${k}</span>`).join('');
            document.getElementById('missingList').innerHTML = missing.map(k => `<span class="px-3 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded-lg text-xs font-semibold">+ ${k}</span>`).join('');
            
            let score = Math.round((matched.length / (matched.length + missing.length)) * 100);
            document.getElementById('atsScoreVal').innerText = `${score}/100`;
        }

        window.onload = runATSCheck;
    </script>
</body>
</html>
